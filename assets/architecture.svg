<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="900" height="300" rx="12" fill="#0d1117"/>

  <!-- EKS cluster -->
  <rect x="420" y="20" width="460" height="260" rx="10" fill="#161b22" stroke="#FF9900" stroke-width="1.5"/>
  <text x="650" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#FF9900">Amazon EKS Cluster</text>

  <!-- Nodes -->
  <g fill="#21262d" stroke="#8b949e" stroke-width="1.2">
    <rect x="20" y="125" width="110" height="50" rx="6"/>
    <rect x="170" y="125" width="140" height="50" rx="6"/>
    <rect x="450" y="55" width="170" height="60" rx="6"/>
    <rect x="450" y="185" width="170" height="60" rx="6"/>
    <rect x="700" y="185" width="160" height="60" rx="6"/>
  </g>

  <g fill="#e6edf3" font-size="14" text-anchor="middle">
    <text x="75" y="155">User</text>
    <text x="240" y="155">AWS Load Balancer</text>
    <text x="535" y="82">Frontend</text>
    <text x="535" y="100" font-size="12" fill="#9aa4b2">React + Nginx</text>
    <text x="535" y="212">Backend</text>
    <text x="535" y="230" font-size="12" fill="#9aa4b2">Node.js + Express</text>
    <text x="780" y="212">MongoDB</text>
    <text x="780" y="230" font-size="12" fill="#9aa4b2">Persistent Storage</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M130 150 H170"/>
    <path d="M310 150 H360 V85 H450"/>
    <path d="M310 150 H360 V215 H450"/>
    <path d="M620 215 H700"/>
  </g>

  <!-- Labels -->
  <g font-size="12" fill="#c9d1d9" text-anchor="middle">
    <text x="405" y="76">/ (website)</text>
    <text x="405" y="206">/api (data)</text>
  </g>
</svg>
